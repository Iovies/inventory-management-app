---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: inventory-app
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: inventory-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: inventory-config
        volumeMounts:
        - name: sqlite-data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "768Mi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /api/products
            port: 8080
          failureThreshold: 90
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/products
            port: 8080
          periodSeconds: 20
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/products
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 10
      volumes:
      - name: sqlite-data
        persistentVolumeClaim:
          claimName: sqlite-data

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: inventory-app
spec:
  selector:
    app: backend
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
